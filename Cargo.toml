[workspace]
resolver = "2"
members = [
    "crates/multipost-core",
    "crates/multipost-proto",
    "crates/multipost-storage",
    "crates/multipost-orchestrator",
    "crates/multipost-server",
    "crates/multipost-cli",
    "crates/multipost-publishers/youtube",
    "crates/multipost-publishers/wx-gzh",
    "crates/multipost-publishers/douyin",
    "crates/multipost-publishers/toutiao",
    "crates/multipost-publishers/twitter",
    "crates/multipost-crawlers/toutiao",
    "crates/multipost-crawlers/twitter",
    "crates/multipost-crawlers/youtube",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
authors = ["Shuozeli <102564117+Shuozeli@users.noreply.github.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP / web
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "chrono"] }

# Errors
thiserror = "1"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Misc
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
dotenvy = "0.15"
tempfile = "3"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
pulldown-cmark = "0.11"

# CDP / WebSocket — minimal CDP client for browser-automation publishers.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Internal crates
multipost-core = { path = "crates/multipost-core" }
multipost-proto = { path = "crates/multipost-proto" }
multipost-storage = { path = "crates/multipost-storage" }
multipost-orchestrator = { path = "crates/multipost-orchestrator" }
multipost-publishers-youtube = { path = "crates/multipost-publishers/youtube" }
multipost-publishers-wx-gzh = { path = "crates/multipost-publishers/wx-gzh" }
multipost-publishers-douyin = { path = "crates/multipost-publishers/douyin" }
multipost-publishers-toutiao = { path = "crates/multipost-publishers/toutiao" }
multipost-publishers-twitter = { path = "crates/multipost-publishers/twitter" }
multipost-crawlers-toutiao = { path = "crates/multipost-crawlers/toutiao" }
multipost-crawlers-twitter = { path = "crates/multipost-crawlers/twitter" }
multipost-crawlers-youtube = { path = "crates/multipost-crawlers/youtube" }

[profile.release]
lto = "thin"
codegen-units = 1
