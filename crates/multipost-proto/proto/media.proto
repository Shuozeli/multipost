syntax = "proto3";

package media;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service Media {
  // Upload a media file. First chunk MUST set `meta`; subsequent chunks
  // are raw bytes.
  rpc Upload(stream UploadChunk) returns (MediaAsset);

  // Get a media record by ID.
  rpc Get(MediaRef) returns (MediaAsset);

  // Delete a media record AND its backing object in storage.
  rpc Delete(MediaRef) returns (google.protobuf.Empty);
}

message UploadChunk {
  oneof payload {
    // First chunk only.
    UploadMeta meta = 1;
    // All subsequent chunks.
    bytes data = 2;
  }
}

message UploadMeta {
  // Caller-supplied filename (informational).
  string filename = 1;
  string mime_type = 2;
  int64 total_bytes = 3;
}

// Renamed from `Media` to avoid a name collision with the service in the
// same package (proto disallows that).
message MediaAsset {
  string id = 1;
  // S3-style URI: s3://bucket/key
  string uri = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  int32 width = 5;
  int32 height = 6;
  int32 duration_ms = 7;
  string sha256 = 8;
  google.protobuf.Timestamp created_at = 9;
}

message MediaRef {
  string id = 1;
}
